<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Vibrant Cyan / Sky Blue Gradient for Outer Stroke -->
    <linearGradient id="fgDropStroke" x1="256" y1="80" x2="256" y2="475" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Translucent Background Fill for dark tab visibility -->
    <linearGradient id="fgDropFill" x1="256" y1="80" x2="256" y2="475" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.10" />
    </linearGradient>

    <!-- Gradient for foreground deep wave -->
    <linearGradient id="fgWaveDeep" x1="256" y1="320" x2="256" y2="475" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Gradient for mid wave -->
    <linearGradient id="fgWaveMid" x1="256" y1="280" x2="256" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>

    <!-- Drop Clip Path to keep waves strictly inside droplet -->
    <clipPath id="fgDropClip">
      <path d="M256 102 C256 102, 396 248, 396 342 C396 418, 333 475, 256 475 C179 475, 116 418, 116 342 C116 248, 256 102, 256 102 Z" />
    </clipPath>
  </defs>

  <!-- 1. IOT RADAR PULSE ARCS (TOP) -->
  <!-- Outer Pulse Arc -->
  <path d="M158 78 A 125 125 0 0 1 354 78" stroke="#38BDF8" stroke-width="16" stroke-linecap="round" stroke-opacity="0.9" />
  
  <!-- Middle Pulse Arc -->
  <path d="M194 98 A 82 82 0 0 1 318 98" stroke="#0EA5E9" stroke-width="18" stroke-linecap="round" />

  <!-- Sensor Beacon Node Dot -->
  <circle cx="256" cy="122" r="16" fill="#38BDF8" />
  <circle cx="256" cy="122" r="7" fill="#FFFFFF" />

  <!-- 2. MAIN WATER DROPLET BODY (CLIPPED WAVES) -->
  <g clip-path="url(#fgDropClip)">
    <!-- Base fill for droplet -->
    <rect x="90" y="80" width="332" height="420" fill="url(#fgDropFill)" />

    <!-- Wave Layer 1 (Light Sky Blue) -->
    <path d="M90 330 Q 175 308 256 335 T 422 320 L 422 490 L 90 490 Z" fill="#BAE6FD" fill-opacity="0.85" />

    <!-- Wave Layer 2 (Vibrant Cyan / Sky Blue) -->
    <path d="M90 355 Q 180 330 266 360 T 422 346 L 422 490 L 90 490 Z" fill="url(#fgWaveMid)" />

    <!-- Wave Layer 3 (Deep Blue Base) -->
    <path d="M90 382 Q 185 360 276 385 T 422 372 L 422 490 L 90 490 Z" fill="url(#fgWaveDeep)" />

    <!-- Wave Crest Highlight -->
    <path d="M116 355 Q 180 330 266 360 T 396 346" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none" stroke-opacity="0.9" />

    <!-- Telemetry Data Nodes / Bubbles -->
    <circle cx="218" cy="415" r="9" fill="#FFFFFF" fill-opacity="0.5" />
    <circle cx="304" cy="430" r="13" fill="#FFFFFF" fill-opacity="0.35" />
    <circle cx="244" cy="448" r="6" fill="#FFFFFF" fill-opacity="0.45" />
  </g>

  <!-- 3. DROPLET OUTER CONTOUR (VIBRANT STROKE) -->
  <path d="M256 102 C256 102, 396 248, 396 342 C396 418, 333 475, 256 475 C179 475, 116 418, 116 342 C116 248, 256 102, 256 102 Z" 
        stroke="url(#fgDropStroke)" stroke-width="24" stroke-linejoin="round" stroke-linecap="round" />

  <!-- 4. WATER LEVEL TELEMETRY GAUGE NOTCHES -->
  <!-- Vertical Guide Line -->
  <line x1="158" y1="285" x2="158" y2="430" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" />

  <!-- Notch 1 (Alert / High Level) -->
  <line x1="158" y1="285" x2="236" y2="285" stroke="#38BDF8" stroke-width="16" stroke-linecap="round" />
  
  <!-- Notch 2 (Sub Notch) -->
  <line x1="158" y1="321" x2="210" y2="321" stroke="#BAE6FD" stroke-width="13" stroke-linecap="round" />

  <!-- Notch 3 (Warning / Mid Level) -->
  <line x1="158" y1="358" x2="265" y2="358" stroke="#38BDF8" stroke-width="16" stroke-linecap="round" />

  <!-- Notch 4 (Sub Notch) -->
  <line x1="158" y1="394" x2="214" y2="394" stroke="#BAE6FD" stroke-width="13" stroke-linecap="round" />

  <!-- Notch 5 (Base Level) -->
  <line x1="158" y1="430" x2="248" y2="430" stroke="#38BDF8" stroke-width="16" stroke-linecap="round" />

  <!-- 5. SPECULAR HIGHLIGHT CURVE (GLOSS) -->
  <path d="M340 240 C366 285 372 332 365 372" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-opacity="0.8" />
</svg>